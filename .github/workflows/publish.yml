name: verify

# On push to main: validate the commands and confirm the committed dist/ is up to date. This workflow
# does NOT commit or push anything — the maintainer commits the generated dist/ alongside the source (the
# build is byte-deterministic), so CI never gets ahead of the local branch. If dist/ is stale, CI fails
# with a clear message instead of silently rewriting it.
on:
  push:
    branches: [main]
    paths:
      - "commands/**"
      - "app-compat/**"
      - "tools/**"
      - "dist/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate commands
        run: python tools/build_index.py --check

      - name: Verify dist/ is up to date
        run: |
          python tools/build_index.py
          if ! git diff --quiet -- dist; then
            echo "::error::dist/ is out of date. Run 'python tools/build_index.py' locally and commit the result."
            git --no-pager diff --stat -- dist
            exit 1
          fi
          echo "dist/ is up to date."
