name: validate

# PR gate: every submission is validated with the same rules the app uses before a human reviews it.
on:
  pull_request:
    paths:
      - "commands/**"
      - "app-compat/**"
      - "tools/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate commands
        run: python tools/build_index.py --check

      - name: Reject hand-edited dist/
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          if git diff --name-only "origin/${{ github.base_ref }}"...HEAD | grep -q '^dist/'; then
            echo "::error::Do not edit dist/ — it is generated by the publish workflow."
            exit 1
          fi
